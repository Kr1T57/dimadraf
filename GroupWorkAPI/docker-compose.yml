services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rafael
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts/postgres_localhost-2026_09_08_22_10_44-dump.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build:
      context: ./GroupWorkAPI
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=postgres;Username=postgres;Password=rafael
    depends_on:
      - db

volumes:
  pgdata:
