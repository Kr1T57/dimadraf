services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rafael
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts/postgres_localhost-2026_09_08_22_10_44-dump.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build:
      context: ./GroupWorkAPI
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OpenRouter__ApiKey=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
      - OpenRouter__Model=nvidia/nemotron-3-super-120b-a12b:free
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=postgres;Username=postgres;Password=rafael
    depends_on:
      - db

volumes:
  pgdata:
