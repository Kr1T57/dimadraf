services:
  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data 
      - ./init-scripts/postgres_localhost-2026_09_08_22_10_44-dump.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5434:5432" 
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rafael
      POSTGRES_DB: postgres
    networks:
      - my-network

  api:
    image: rafae1ka/groupworkapi:latest
    build:
      context: ./GroupWorkAPI
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:8080" 
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=postgres;Username=postgres;Password=rafael
      - DBHOST=db
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db
    networks:
      - my-network
      
volumes:
  pgdata:

networks:
  my-network:
    driver: bridge